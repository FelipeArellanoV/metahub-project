# Servidor web del frontend: sirve la aplicación y reenvía las llamadas /api a los servicios.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Videos de hasta 50 MB (límite de la API) y análisis que puede tardar
    client_max_body_size 60m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # Servicio de visión (debe ir antes de /api/)
    location /api/cv/ {
        proxy_pass http://cv-service:8000;
        proxy_set_header Host $host;
        proxy_request_buffering off;
    }

    # API de MetaHub
    location /api/ {
        proxy_pass http://api-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
