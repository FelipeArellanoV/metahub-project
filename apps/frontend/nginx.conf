# Servidor web del frontend: sirve la SPA React y reenvía /api a la API de MetaHub.
# Desarrollo: lo publica docker-compose.yml en el puerto 80.
# Producción: queda detrás de Caddy (HTTPS), ver docker-compose.prod.yml y docs/despliegue.md.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Videos de hasta 50 MB (límite de la API) y análisis que puede tardar
    client_max_body_size 60m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # API de MetaHub. /api/cv también entra aquí: la API exige sesión y reenvía al servicio de visión,
    # que ya no se expone directamente.
    location /api/ {
        proxy_pass http://api-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # Healthcheck del contenedor
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Páginas estáticas antiguas: ahora todo vive en la SPA (raíz /)
    location ~ ^/(app|preview|mobile)\.html$ {
        return 301 /$is_args$args;
    }

    # El service worker y el HTML deben revalidarse siempre para que las actualizaciones lleguen.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Archivos con hash de Vite: inmutables
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
