version: '3.8'

services:
  # 1. Base de datos TimescaleDB / PostgreSQL
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: metahub-timescaledb
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-metahub_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api-backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. API Backend (Node.js REST API)
  api-backend:
    build:
      context: ./apps/api-backend
      dockerfile: Dockerfile
    container_name: metahub-api-backend
    restart: always
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_metahub_2026}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-metahub_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-metahub_db}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # 3. Servicio de Visión por Computador (Python FastAPI + MediaPipe)
  cv-service:
    build:
      context: ./apps/cv-service
      dockerfile: Dockerfile
    container_name: metahub-cv-service
    restart: always
    ports:
      - "8000:8000"

  # 4. Frontend (React PWA + Nginx)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: metahub-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api-backend
      - cv-service

volumes:
  pgdata:
