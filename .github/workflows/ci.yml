name: MetaHub CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-api-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd apps/api-backend
          npm install

      - name: Run Backend Tests
        run: |
          cd apps/api-backend
          node tests/run_tests.js

  test-cv-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          cd apps/cv-service
          pip install -r requirements.txt

      - name: Run CV Service Tests
        run: |
          cd apps/cv-service
          python test_metrics.py
